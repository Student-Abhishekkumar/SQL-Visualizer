<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SQL Visualizer — an interactive SQL playground that shows you how databases really work."
    />
    <title>SQL Visualizer</title>
    <!-- Same-origin classic script: applies the saved theme before paint and
         remains compatible with the deployed script-src 'self' CSP. -->
    <script src="/theme-init.js"></script>
    <style>
      /* Branded pre-bundle splash: a calm static frame of the React
         "bioluminescent bloom" loader, so the hand-off never jumps and the
         first paint carries no bars, spinners or fake progress. */
      html,
      body {
        margin: 0;
        background: #080d17;
      }
      :root[data-theme='light'] body {
        background: #f6f8fc;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background-image: radial-gradient(circle, rgba(148, 163, 184, 0.16) 1px, transparent 1px);
        background-size: 30px 30px;
        color: #8796b1;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      :root[data-theme='light'] #boot-splash {
        background-image: radial-gradient(circle, rgba(100, 116, 139, 0.22) 1px, transparent 1px);
      }
      .boot-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 46vmin;
        height: 72vmin;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          ellipse at center,
          rgba(114, 160, 255, 0.22),
          rgba(34, 211, 238, 0.1) 45%,
          transparent 70%
        );
        pointer-events: none;
      }
      .boot-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .boot-title {
        color: #f1f5fc;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .boot-detail {
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      :root[data-theme='light'] .boot-title {
        color: #101828;
      }
      :root[data-theme='light'] .boot-detail {
        color: #5f6b7a;
      }
      .reduce-effects .boot-glow {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-glow {
          filter: blur(24px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite" aria-atomic="true">
        <div class="boot-glow" aria-hidden="true"></div>
        <div class="boot-inner">
          <div class="boot-title">SQL Visualizer</div>
          <div class="boot-detail">Preparing your local workspace…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
