<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SQL Visualizer — an interactive SQL playground that shows you how databases really work."
    />
    <title>SQL Visualizer</title>
    <style>
      /* Prevent flash of unstyled content before the bundle loads */
      html,
      body {
        margin: 0;
        background: #0a0f1e;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #7c8db5;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        letter-spacing: 0.05em;
      }
      #boot-splash[data-theme='light'] {
        background: #f7f9fc;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-splash">Loading SQL Visualizer…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
